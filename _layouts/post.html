---
layout: default
---
<article>
  <div class="post-header">
    <p class="post-eyebrow">{{ page.date | date: "%d %B %Y" }}{% if page.tags %} · {{ page.tags | join: ", " }}{% endif %}</p>
    {% if page.level %}
    <p class="post-level">{{ page.level }} read</p>
    {% endif %}
    <h1 class="post-title">{{ page.title }}</h1>
  </div>

  {% if page.image %}
  <div class="post-hero-image">
    <img
      src="{% if page.image contains '://' %}{{ page.image }}{% else %}{{ page.image | relative_url }}{% endif %}"
      alt="{{ page.image_alt | default: page.title }}"
    >
  </div>
  {% endif %}

  <div class="post-content">
    {{ content }}
  </div>
</article>
