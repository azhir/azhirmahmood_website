---
layout: default
---
<article>
  <div class="post-header">
    <p class="post-eyebrow">{{ page.date | date: "%d %B %Y" }}{% if page.tags %} · {{ page.tags | join: ", " }}{% endif %}</p>
    <h1 class="post-title">{{ page.title }}</h1>
  </div>
  <div class="post-content">
    {{ content }}
  </div>
</article>
