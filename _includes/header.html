<header class="site-header">

  <!-- =====================================================
     CONSTELLATION GRAPHIC
     Traces "Eridanus" (the River constellation) as a winding
     chain of stars. The star marked with an orange blossom is
     "Azha" (Eta Eridani) — a real star whose Arabic name is
     phonetically close to "Azhir", and the blossom motif nods
     to "Azhar" meaning "to bloom/shine" in Arabic.
     ===================================================== -->
  <svg class="chart-svg" viewBox="0 0 180 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

    <!-- The winding river-like path connecting the star chain -->
    <path class="chart-line" d="M8,10 Q26,22 20,40 T34,64 T24,92 T44,110" fill="none"/>
    <!-- Two extra branch lines connecting into the Azha node -->
    <line class="chart-line" x1="20" y1="40" x2="52" y2="36"/>
    <line class="chart-line" x1="34" y1="64" x2="62" y2="70"/>

    <!-- The regular (non-Azha) stars along the chain -->
    <circle class="chart-dot" cx="8" cy="10" r="1.6"/>
    <circle class="chart-dot" cx="20" cy="40" r="1.8"/>
    <circle class="chart-dot" cx="24" cy="92" r="1.6"/>
    <circle class="chart-dot" cx="44" cy="110" r="1.4"/>
    <circle class="chart-dot" cx="62" cy="70" r="1.4"/>

    <!-- =====================================================
       AZHA, rendered as an orange blossom instead of a plain dot.
       Positioned at (52,36) — the same spot the two branch lines
       above connect into. Scaled down (0.85) to fit the chart.
       ===================================================== -->
    <g transform="translate(52,36) scale(0.85)">

      <!-- Five petals: each is the same paddle-shaped path
         (narrow at the base, widening out, tapering to a point),
         rotated 72° apart to form five-fold symmetry -->
      <g class="blossom-petal">
        <path d="M0,-1.3 C-1.6,-3.4 -3.4,-5.6 -4.6,-8.4
                 C-5.4,-11.5 -1.6,-13.4 0,-13.6
                 C1.6,-13.4 5.4,-11.5 4.6,-8.4
                 C3.4,-5.6 1.6,-3.4 0,-1.3 Z" transform="rotate(0)"/>
        <path d="M0,-1.3 C-1.6,-3.4 -3.4,-5.6 -4.6,-8.4
                 C-5.4,-11.5 -1.6,-13.4 0,-13.6
                 C1.6,-13.4 5.4,-11.5 4.6,-8.4
                 C3.4,-5.6 1.6,-3.4 0,-1.3 Z" transform="rotate(72)"/>
        <path d="M0,-1.3 C-1.6,-3.4 -3.4,-5.6 -4.6,-8.4
                 C-5.4,-11.5 -1.6,-13.4 0,-13.6
                 C1.6,-13.4 5.4,-11.5 4.6,-8.4
                 C3.4,-5.6 1.6,-3.4 0,-1.3 Z" transform="rotate(144)"/>
        <path d="M0,-1.3 C-1.6,-3.4 -3.4,-5.6 -4.6,-8.4
                 C-5.4,-11.5 -1.6,-13.4 0,-13.6
                 C1.6,-13.4 5.4,-11.5 4.6,-8.4
                 C3.4,-5.6 1.6,-3.4 0,-1.3 Z" transform="rotate(216)"/>
        <path d="M0,-1.3 C-1.6,-3.4 -3.4,-5.6 -4.6,-8.4
                 C-5.4,-11.5 -1.6,-13.4 0,-13.6
                 C1.6,-13.4 5.4,-11.5 4.6,-8.4
                 C3.4,-5.6 1.6,-3.4 0,-1.3 Z" transform="rotate(288)"/>
      </g>

      <!-- Yellow stamen filaments radiating from the flower's center,
         each with a small dot "anther" at the tip -->
      <g stroke="#E8B84B" stroke-width="0.5" stroke-linecap="round" opacity="0.9">
        <line x1="0" y1="0" x2="1.8" y2="-1.5"/>
        <line x1="0" y1="0" x2="2.3" y2="0.2"/>
        <line x1="0" y1="0" x2="1.6" y2="1.9"/>
        <line x1="0" y1="0" x2="-0.4" y2="2.4"/>
        <line x1="0" y1="0" x2="-1.8" y2="1.6"/>
        <line x1="0" y1="0" x2="-2.2" y2="-0.3"/>
        <line x1="0" y1="0" x2="-1.3" y2="-1.9"/>
        <line x1="0" y1="0" x2="0.5" y2="-2.3"/>
      </g>
      <!-- The flower's central core (darker gold) -->
      <circle cx="0" cy="0" r="1" fill="#D9A038"/>
    </g>
  </svg>

  <!-- Azha's real celestial coordinates (Eta Eridani) — factual detail
     that reinforces the "field notes" theme -->
  <p class="coord-tick">Azha &middot; &eta; Eridani &middot; RA 02h 56m DEC &minus;08&deg; 53&prime;</p>

  <!-- Site title — links back to the homepage -->
  <p class="site-title"><a href="{{ '/' | relative_url }}">Azhir Mahmood</a></p>

  <!-- Tagline pulled from _config.yml (site.tagline) -->
  <p class="site-tagline">{{ site.tagline }}</p>

  <!-- Main navigation -->
  <nav class="site-nav">
    <a href="{{ '/' | relative_url }}">Writing</a>
    <a href="{{ '/about/' | relative_url }}">About</a>
    <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
  </nav>
</header>
