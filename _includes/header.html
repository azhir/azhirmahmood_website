<header class="site-header">
  <div class="site-header-inner">

    <div class="site-header-content">

      <p class="coord-tick">
        Azha &middot; &eta; Eridani &middot; al-Nahr (النهر)
        &middot; RA 02h 56m DEC &minus;08&deg; 53&prime;
      </p>

      <p class="site-title">
        <a href="{{ '/' | relative_url }}">
          Azhir Mahmood
        </a>
      </p>

      <p class="site-tagline">
        {{ site.tagline }}
      </p>

      <nav class="site-nav">

        <a href="{{ '/' | relative_url }}">
          Writing
        </a>

        <span
          class="nav-sep"
          aria-hidden="true"
        >
          &bull;
        </span>

        <a href="{{ '/research/' | relative_url }}">
          Research
        </a>

        <span
          class="nav-sep"
          aria-hidden="true"
        >
          &bull;
        </span>

        <a href="{{ '/about/' | relative_url }}">
          About
        </a>

      </nav>

    </div>


    <!-- =====================================================
         ERIDANUS CELESTIAL GRAPH

         particles.js:
         - moving stars
         - dynamic connections

         SVG overlay:
         - labels that follow selected named stars
         ===================================================== -->

    <div
      class="chart-wrap"
      aria-hidden="true"
    >

      <div
        id="eridanus-particles"
        class="eridanus-particles"
      ></div>

      <svg
        id="eridanus-chart"
        class="chart-svg"
        viewBox="0 0 260 160"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <g id="eridanus-labels"></g>
      </svg>

    </div>

  </div>
</header>
