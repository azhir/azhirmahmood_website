<header class="site-header">

  <!-- =====================================================
     Islamic geometric lattice (girih) — CSS background
     ===================================================== -->

  <div class="site-header-inner">

    <div class="site-header-content">
      <p class="coord-tick">
        Azha &middot; &eta; Eridani &middot; al-Nahr (النهر)
        &middot; RA 02h 56m DEC &minus;08&deg; 53&prime;
      </p>

      <p class="site-title">
        <a href="{{ '/' | relative_url }}">Azhir Mahmood</a>
      </p>

      <p class="site-tagline">{{ site.tagline }}</p>

      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">Writing</a>
        <span class="nav-sep" aria-hidden="true">&bull;</span>
        <a href="{{ '/research/' | relative_url }}">Research</a>
        <span class="nav-sep" aria-hidden="true">&bull;</span>
        <a href="{{ '/about/' | relative_url }}">About</a>
      </nav>
    </div>

    <svg
      id="eridanus-chart"
      class="chart-svg"
      viewBox="0 0 260 160"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
    >

      <defs>
        <filter id="starGlow" x="-100%" y="-100%" width="300%" height="300%">
          <feGaussianBlur stdDeviation="1.8" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      <!-- faint field stars -->
      <g class="chart-field">
        <circle cx="18"  cy="18"  r="0.7"/>
        <circle cx="48"  cy="12"  r="0.6"/>
        <circle cx="82"  cy="24"  r="0.55"/>
        <circle cx="143" cy="17"  r="0.6"/>
        <circle cx="223" cy="42"  r="0.65"/>

        <circle cx="232" cy="82"  r="0.55"/>
        <circle cx="214" cy="111" r="0.65"/>

        <circle cx="19"  cy="106" r="0.55"/>
        <circle cx="74"  cy="101" r="0.55"/>
        <circle cx="177" cy="112" r="0.6"/>

        <circle cx="84"  cy="149" r="0.55"/>
        <circle cx="227" cy="146" r="0.65"/>
      </g>

      <!-- generated content -->
      <g id="eridanus-river"></g>
      <g id="eridanus-stars"></g>
      <g id="eridanus-labels"></g>

    </svg>

  </div>

  <script>
    (function () {
      const svg = document.getElementById('eridanus-chart');
      if (!svg) return;

      /* =====================================================
         CONTROLS — EDIT THESE
         -----------------------------------------------------
         STRETCH_X : wider / narrower
         STRETCH_Y : taller / flatter
         SHIFT_X   : move whole constellation left / right
         SHIFT_Y   : move whole constellation up / down
         ROTATE_DEG: small compositional correction
         ===================================================== */
      const STRETCH_X = 1.35;
      const STRETCH_Y = 0.90;
      const SHIFT_X   = -200;
      const SHIFT_Y   = 10;
      const ROTATE_DEG = -1.5;

      /* anchor everything around Azha */
      const ANCHOR_X = 116;
      const ANCHOR_Y = 59;

      const svgNS = 'http://www.w3.org/2000/svg';
      const riverG  = document.getElementById('eridanus-river');
      const starsG  = document.getElementById('eridanus-stars');
      const labelsG = document.getElementById('eridanus-labels');

      function makeEl(tag, attrs, parent) {
        const el = document.createElementNS(svgNS, tag);
        for (const key in attrs) {
          el.setAttribute(key, attrs[key]);
        }
        if (parent) parent.appendChild(el);
        return el;
      }

      function mapPoint(x, y) {
        /* stretch around Azha */
        let nx = ANCHOR_X + (x - ANCHOR_X) * STRETCH_X;
        let ny = ANCHOR_Y + (y - ANCHOR_Y) * STRETCH_Y;

        /* optional rotation around Azha */
        if (ROTATE_DEG !== 0) {
          const t = ROTATE_DEG * Math.PI / 180;
          const dx = nx - ANCHOR_X;
          const dy = ny - ANCHOR_Y;
          nx = ANCHOR_X + (dx * Math.cos(t) - dy * Math.sin(t));
          ny = ANCHOR_Y + (dx * Math.sin(t) + dy * Math.cos(t));
        }

        /* global shift */
        nx += SHIFT_X;
        ny += SHIFT_Y;

        return { x: nx, y: ny };
      }

      /* base atlas geometry */
      const stars = {
        cursa:     { x: 211, y: 14,  r: 2.1,  glow: true },
        n1:        { x: 191, y: 23,  r: 0.9,  opacity: 0.55 },
        beid:      { x: 174, y: 33,  r: 1.35, glow: true },
        keid:      { x: 183, y: 48,  r: 1.45, glow: true },
        n2:        { x: 165, y: 58,  r: 0.9,  opacity: 0.50 },
        rana:      { x: 145, y: 69,  r: 1.75, glow: true },
        n3:        { x: 129, y: 81,  r: 0.85, opacity: 0.48 },
        zaurak:    { x: 118, y: 94,  r: 1.75, glow: true },
        n4:        { x: 106, y: 105, r: 0.85, opacity: 0.46 },
        angetenar: { x: 93,  y: 115, r: 1.30, glow: true },
        n5:        { x: 78,  y: 125, r: 0.85, opacity: 0.45 },
        acamar:    { x: 62,  y: 134, r: 1.70, glow: true },
        achernar:  { x: 45,  y: 143, r: 2.25, glow: true },

        azha:      { x: 116, y: 59 }
      };

      const chain = [
        'cursa',
        'n1',
        'beid',
        'keid',
        'n2',
        'rana',
        'n3',
        'zaurak',
        'n4',
        'angetenar',
        'n5',
        'acamar',
        'achernar'
      ];

      /* main river line */
      let d = '';
      chain.forEach(function (name, i) {
        const p = mapPoint(stars[name].x, stars[name].y);
        d += (i === 0 ? 'M' : ' L') + p.x.toFixed(2) + ',' + p.y.toFixed(2);
      });

      makeEl('path', {
        class: 'chart-line',
        d: d,
        fill: 'none'
      }, riverG);

      /* Azha branch */
      const ranaP = mapPoint(stars.rana.x, stars.rana.y);
      const azhaP = mapPoint(stars.azha.x, stars.azha.y);

      makeEl('path', {
        class: 'chart-line',
        d: 'M' + ranaP.x.toFixed(2) + ',' + ranaP.y.toFixed(2) +
           ' L' + azhaP.x.toFixed(2) + ',' + azhaP.y.toFixed(2),
        fill: 'none'
      }, riverG);

      /* star dots — positions move, radii do not */
      Object.keys(stars).forEach(function (name) {
        if (name === 'azha') return;

        const s = stars[name];
        const p = mapPoint(s.x, s.y);

        const attrs = {
          class: 'chart-dot',
          cx: p.x.toFixed(2),
          cy: p.y.toFixed(2),
          r: s.r
        };

        if (s.glow) attrs.filter = 'url(#starGlow)';
        if (typeof s.opacity !== 'undefined') attrs.opacity = s.opacity;

        makeEl('circle', attrs, starsG);
      });

      /* Azha blossom — moves, but does not stretch */
      const azhaG = makeEl('g', {
        transform: 'translate(' + azhaP.x.toFixed(2) + ',' + azhaP.y.toFixed(2) + ') scale(1.18)',
        filter: 'url(#starGlow)'
      }, starsG);

      const petalsG = makeEl('g', { class: 'blossom-petal' }, azhaG);
      const petalD = 'M0,-1.3 C-1.6,-3.4 -3.4,-5.6 -4.6,-8.4 C-5.4,-11.5 -1.6,-13.4 0,-13.6 C1.6,-13.4 5.4,-11.5 4.6,-8.4 C3.4,-5.6 1.6,-3.4 0,-1.3 Z';

      [0, 72, 144, 216, 288].forEach(function (angle) {
        makeEl('path', {
          d: petalD,
          transform: 'rotate(' + angle + ')'
        }, petalsG);
      });

      const raysG = makeEl('g', {
        stroke: '#E8B84B',
        'stroke-width': '0.55',
        'stroke-linecap': 'round',
        opacity: '0.95'
      }, azhaG);

      [
        [1.8, -1.5],
        [2.3, 0.2],
        [1.6, 1.9],
        [-0.4, 2.4],
        [-1.8, 1.6],
        [-2.2, -0.3],
        [-1.3, -1.9],
        [0.5, -2.3]
      ].forEach(function (seg) {
        makeEl('line', {
          x1: 0,
          y1: 0,
          x2: seg[0],
          y2: seg[1]
        }, raysG);
      });

      makeEl('circle', {
        cx: 0,
        cy: 0,
        r: 1.15,
        fill: '#D9A038'
      }, azhaG);

      /* label specs */
      const labels = [
        {
          key: 'cursa',
          text: 'Cursa',
          arabic: 'الكرسي',
          dx: -8, dy: -5,
          adx: -8, ady: 3,
          anchor: 'end',
          fontSize: 8.8,
          opacity: 0.58,
          aFontSize: 7.6,
          aOpacity: 0.36
        },
        {
          key: 'beid',
          text: 'Beid',
          arabic: 'البيض',
          dx: -7, dy: -5,
          adx: -7, ady: 2,
          anchor: 'end',
          fontSize: 7.0,
          opacity: 0.42,
          aFontSize: 6.2,
          aOpacity: 0.28
        },
        {
          key: 'keid',
          text: 'Keid',
          arabic: 'القيد',
          dx: 7, dy: -3,
          adx: 7, ady: 4,
          anchor: 'start',
          fontSize: 7.0,
          opacity: 0.42,
          aFontSize: 6.2,
          aOpacity: 0.28
        },
        {
          key: 'azha',
          text: 'Azha',
          arabic: 'ازها',
          dx: 8, dy: -3,
          adx: 8, ady: 8,
          anchor: 'start',
          fontSize: 11.5,
          opacity: 0.98,
          aFontSize: 9.0,
          aOpacity: 0.70
        },
        {
          key: 'rana',
          text: 'Rana',
          dx: 6, dy: 1,
          anchor: 'start',
          fontSize: 8.0,
          opacity: 0.47
        },
        {
          key: 'zaurak',
          text: 'Zaurak',
          arabic: 'زورق',
          dx: 6, dy: -1,
          adx: 6, ady: 7,
          anchor: 'start',
          fontSize: 8.0,
          opacity: 0.54,
          aFontSize: 7.0,
          aOpacity: 0.34
        },
        {
          key: 'angetenar',
          text: 'Angetenar',
          dx: 6, dy: -1,
          anchor: 'start',
          fontSize: 6.9,
          opacity: 0.39
        },
        {
          key: 'acamar',
          text: 'Acamar',
          arabic: 'آخر النهر',
          dx: 6, dy: -2,
          adx: 6, ady: 6,
          anchor: 'start',
          fontSize: 7.7,
          opacity: 0.48,
          aFontSize: 6.7,
          aOpacity: 0.30
        },
        {
          key: 'achernar',
          text: 'Achernar',
          arabic: 'آخر النهر',
          dx: -6, dy: -6,
          adx: 6, ady: 3,
          anchor: 'end',
          fontSize: 8.5,
          opacity: 0.54,
          aFontSize: 6.9,
          aOpacity: 0.30
        }
      ];

      labels.forEach(function (label) {
        const base = stars[label.key];
        const p = mapPoint(base.x, base.y);

        const textEl = makeEl('text', {
          x: (p.x + label.dx).toFixed(2),
          y: (p.y + label.dy).toFixed(2),
          'font-family': 'Georgia, serif',
          'font-style': 'italic',
          'font-size': label.fontSize,
          fill: 'currentColor',
          opacity: label.opacity,
          'text-anchor': label.anchor || 'start'
        }, labelsG);
        textEl.textContent = label.text;

        if (label.arabic) {
          const aText = makeEl('text', {
            x: (p.x + label.adx).toFixed(2),
            y: (p.y + label.ady).toFixed(2),
            'font-family': 'Georgia, serif',
            'font-size': label.aFontSize,
            fill: 'currentColor',
            opacity: label.aOpacity,
            'text-anchor': label.anchor || 'start',
            direction: 'rtl'
          }, labelsG);
          aText.textContent = label.arabic;
        }
      });

      /* constellation caption — moves with the geometry */
      const cap = mapPoint(82, 94);

      const capEn = makeEl('text', {
        x: cap.x.toFixed(2),
        y: cap.y.toFixed(2),
        'font-family': 'Georgia, serif',
        'font-size': 5.8,
        'letter-spacing': 1.1,
        fill: 'currentColor',
        opacity: 0.10
      }, labelsG);
      capEn.textContent = 'ERIDANUS';

      const capAr = makeEl('text', {
        x: cap.x.toFixed(2),
        y: (cap.y + 8).toFixed(2),
        'font-family': 'Georgia, serif',
        'font-size': 6.4,
        fill: 'currentColor',
        opacity: 0.13,
        direction: 'rtl'
      }, labelsG);
      capAr.textContent = 'النهر';
    })();
  </script>

</header>
